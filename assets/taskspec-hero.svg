<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d">
  <title id="t">The task-spec closed loop</title>
  <desc id="d">Five stages: the author writes the spec, validate lints its structure, the PRE-gate seals the eval bodies in an HMAC envelope and signs off, any conformant executor dispatches and runs the work, and the POST-gate re-runs the evals from a clean checkout, checks the blast radius, re-verifies the seal, and stamps accepted.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ba3b5" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5cc8ff"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff5d73"/>
    </marker>
    <filter id="glow-g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-a" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .stage  { fill:#101b26; stroke-width:2.5; }
      .name   { font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:24px; letter-spacing:3px; }
      .sub    { font-family:Menlo,'SF Mono',monospace; font-size:14.5px; fill:#8ba3b5; }
      .tok    { font-family:Menlo,'SF Mono',monospace; font-size:14px; }
      .edge   { stroke:#5cc8ff; stroke-width:2.5; fill:none; }
    </style>
  </defs>

  <rect width="1400" height="560" fill="#0a0f14"/>
  <rect width="1400" height="560" fill="url(#grid)"/>

  <!-- edges -->
  <path class="edge" d="M268 250 H322" marker-end="url(#arr)"/>
  <path class="edge" d="M548 250 H602" marker-end="url(#arr)"/>
  <path class="edge" d="M828 250 H882" marker-end="url(#arr)"/>
  <path class="edge" d="M1108 250 H1162" marker-end="url(#arr)"/>

  <!-- 1 author -->
  <rect class="stage" x="108" y="180" width="160" height="140" rx="16" stroke="#5cc8ff"/>
  <text class="name" x="188" y="238" fill="#f2f6f4" text-anchor="middle">AUTHOR</text>
  <text class="sub" x="188" y="268" text-anchor="middle">intent + evals</text>
  <text class="sub" x="188" y="292" text-anchor="middle">taskspec new</text>

  <!-- 2 validate -->
  <rect class="stage" x="388" y="180" width="160" height="140" rx="16" stroke="#5cc8ff"/>
  <text class="name" x="468" y="238" fill="#f2f6f4" text-anchor="middle">VALIDATE</text>
  <text class="sub" x="468" y="268" text-anchor="middle">structure +</text>
  <text class="sub" x="468" y="292" text-anchor="middle">behavior↔eval</text>

  <!-- 3 pre-gate -->
  <g filter="url(#glow-a)">
    <rect class="stage" x="668" y="180" width="160" height="140" rx="16" stroke="#ffb454"/>
  </g>
  <text class="name" x="748" y="232" fill="#ffb454" text-anchor="middle">GATE</text>
  <text class="sub" x="748" y="262" text-anchor="middle">HMAC-seals evals</text>
  <text class="tok" x="748" y="292" fill="#ffb454" text-anchor="middle">signed_off: true</text>

  <!-- 4 dispatch -->
  <rect class="stage" x="948" y="180" width="160" height="140" rx="16" stroke="#5cc8ff"/>
  <text class="name" x="1028" y="238" fill="#f2f6f4" text-anchor="middle">EXECUTE</text>
  <text class="sub" x="1028" y="268" text-anchor="middle">any conformant</text>
  <text class="sub" x="1028" y="292" text-anchor="middle">executor L0–L2</text>

  <!-- 5 accept -->
  <g filter="url(#glow-g)">
    <rect class="stage" x="1228" y="180" width="160" height="140" rx="16" stroke="#3ddc97"/>
  </g>
  <text class="name" x="1308" y="232" fill="#3ddc97" text-anchor="middle">ACCEPT</text>
  <text class="sub" x="1308" y="256" text-anchor="middle">clean re-run +</text>
  <text class="sub" x="1308" y="274" text-anchor="middle">blast radius</text>
  <text class="tok" x="1308" y="302" fill="#3ddc97" text-anchor="middle">accepted: true</text>

  <!-- fail-closed routes -->
  <path d="M748 320 V420 H188 V330" fill="none" stroke="#ff5d73" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr-red)"/>
  <path d="M1308 320 V448 H188 V330" fill="none" stroke="#ff5d73" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr-red)" opacity="0.75"/>
  <text class="tok" x="748" y="414" fill="#ff5d73" text-anchor="end">seal broken / evals red → not delegate-safe&#160;&#160;</text>
  <text class="tok" x="1308" y="442" fill="#ff5d73" text-anchor="end">work not real → loop back, budget −1&#160;&#160;</text>

  <!-- caption -->
  <text x="700" y="96" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#f2f6f4" text-anchor="middle">THE CLOSED LOOP</text>
  <text x="700" y="132" font-family="Menlo,'SF Mono',monospace" font-size="15" letter-spacing="2" fill="#8ba3b5" text-anchor="middle">green evals from a clean checkout are the definition of done — not a claim</text>

  <!-- human anchors -->
  <text class="tok" x="188" y="540" fill="#ffb454" text-anchor="middle">human: intent</text>
  <text class="tok" x="1392" y="540" fill="#ffb454" text-anchor="end">human: acceptance review</text>
  <text class="tok" x="748" y="540" fill="#8ba3b5" text-anchor="middle">the loop in between runs without them</text>
</svg>
