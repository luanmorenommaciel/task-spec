<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">task-spec banner — write it, seal it, prove it</title>
  <desc id="d">A markdown spec document flows along a cyan rail through an amber HMAC seal gate and emerges as a glowing green checkmark: the task-spec closed loop.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ba3b5" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0f14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05080c" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5cc8ff" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#5cc8ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffb454" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101b26"/>
      <stop offset="100%" stop-color="#0c141d"/>
    </linearGradient>
    <filter id="glow-green" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="#0a0f14"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <rect width="1600" height="800" fill="url(#vignette)"/>

  <!-- flow rail -->
  <path d="M120 400 H1480" fill="none" stroke="url(#rail)" stroke-width="3"/>
  <circle cx="480" cy="400" r="5" fill="#5cc8ff"/>
  <circle cx="1120" cy="400" r="5" fill="#3ddc97"/>

  <!-- stage labels -->
  <g font-family="Menlo, 'SF Mono', monospace" font-size="19" letter-spacing="6" text-anchor="middle">
    <text x="310" y="600" fill="#8ba3b5">WRITE</text>
    <text x="800" y="600" fill="#ffb454">SEAL</text>
    <text x="1290" y="600" fill="#3ddc97">PROVE</text>
  </g>

  <!-- the spec document -->
  <g filter="url(#soft)">
    <rect x="215" y="225" width="190" height="250" rx="14" fill="url(#page)" stroke="#5cc8ff" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <!-- frontmatter -->
  <g stroke-linecap="round">
    <line x1="240" y1="258" x2="380" y2="258" stroke="#ffb454" stroke-width="5" stroke-opacity="0.9"/>
    <line x1="240" y1="276" x2="352" y2="276" stroke="#8ba3b5" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="240" y1="292" x2="366" y2="292" stroke="#8ba3b5" stroke-width="4" stroke-opacity="0.55"/>
    <line x1="240" y1="308" x2="332" y2="308" stroke="#8ba3b5" stroke-width="4" stroke-opacity="0.4"/>
  </g>
  <!-- eval block -->
  <rect x="238" y="330" width="144" height="86" rx="8" fill="#05080c" stroke="#3ddc97" stroke-opacity="0.45" stroke-width="1.5"/>
  <g stroke-linecap="round">
    <line x1="252" y1="352" x2="322" y2="352" stroke="#3ddc97" stroke-width="4"/>
    <line x1="252" y1="370" x2="352" y2="370" stroke="#5cc8ff" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="252" y1="388" x2="300" y2="388" stroke="#8ba3b5" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="252" y1="404" x2="336" y2="404" stroke="#3ddc97" stroke-width="4" stroke-opacity="0.8"/>
  </g>
  <text x="310" y="452" font-family="Menlo, 'SF Mono', monospace" font-size="15" fill="#8ba3b5" text-anchor="middle">eval_1()</text>

  <!-- the seal gate -->
  <g filter="url(#glow-amber)">
    <circle cx="800" cy="400" r="118" fill="#0c141d" stroke="#ffb454" stroke-width="3"/>
    <circle cx="800" cy="400" r="96" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="7 9" stroke-opacity="0.8"/>
  </g>
  <!-- wax-seal scallops -->
  <g fill="#ffb454" fill-opacity="0.14" stroke="#ffb454" stroke-opacity="0.5" stroke-width="1.5">
    <circle cx="800" cy="400" r="78"/>
  </g>
  <!-- lock -->
  <g stroke="#ffb454" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M778 396 v-16 a22 22 0 0 1 44 0 v16"/>
    <rect x="770" y="396" width="60" height="48" rx="9" fill="#ffb454" fill-opacity="0.92" stroke="none"/>
  </g>
  <circle cx="800" cy="414" r="6" fill="#0a0f14"/>
  <line x1="800" y1="418" x2="800" y2="430" stroke="#0a0f14" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="556" font-family="Menlo, 'SF Mono', monospace" font-size="14" letter-spacing="2" fill="#ffb454" text-anchor="middle" opacity="0.85">HMAC-SHA256</text>

  <!-- the proof -->
  <g filter="url(#glow-green)">
    <circle cx="1290" cy="400" r="92" fill="#0c141d" stroke="#3ddc97" stroke-width="3"/>
    <path d="M1248 402 l30 30 l58 -64" fill="none" stroke="#3ddc97" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1290" y="540" font-family="Menlo, 'SF Mono', monospace" font-size="14" letter-spacing="2" fill="#3ddc97" text-anchor="middle" opacity="0.85">ACCEPTED=1</text>

  <!-- wordmark -->
  <text x="800" y="150" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58" letter-spacing="18" fill="#f2f6f4" text-anchor="middle">TASK-SPEC</text>
  <text x="800" y="196" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="19" letter-spacing="7" fill="#8ba3b5" text-anchor="middle">THE SELF-VERIFYING UNIT OF WORK</text>
</svg>
