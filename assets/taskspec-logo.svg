<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="t d">
  <title id="t">task-spec wordmark lockup</title>
  <desc id="d">Horizontal lockup: the task-spec page-and-seal mark beside the TASK-SPEC wordmark and the DEFINE DONE · PROVE THE WORK subline.</desc>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1120" height="280" fill="#0a0f14"/>

  <!-- mark -->
  <g transform="translate(72 44) scale(0.75)">
    <rect x="0" y="0" width="256" height="256" rx="56" fill="#0d1620"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#8ba3b5" stroke-opacity="0.25" stroke-width="2.5"/>
    <rect x="66" y="52" width="124" height="152" rx="12" fill="#101b26" stroke="#5cc8ff" stroke-opacity="0.7" stroke-width="3"/>
    <g stroke-linecap="round">
      <line x1="84" y1="80" x2="172" y2="80" stroke="#ffb454" stroke-width="6"/>
      <line x1="84" y1="98" x2="156" y2="98" stroke="#8ba3b5" stroke-width="5" stroke-opacity="0.75"/>
      <line x1="84" y1="113" x2="164" y2="113" stroke="#8ba3b5" stroke-width="5" stroke-opacity="0.5"/>
    </g>
    <rect x="82" y="128" width="92" height="44" rx="7" fill="#05080c" stroke="#3ddc97" stroke-opacity="0.5" stroke-width="2"/>
    <g stroke-linecap="round">
      <line x1="92" y1="143" x2="134" y2="143" stroke="#3ddc97" stroke-width="4"/>
      <line x1="92" y1="158" x2="150" y2="158" stroke="#5cc8ff" stroke-width="4" stroke-opacity="0.85"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="168" cy="176" r="46" fill="#0c141d" stroke="#ffb454" stroke-width="4"/>
      <circle cx="168" cy="176" r="35" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 6" stroke-opacity="0.8"/>
      <path d="M152 177 l12 12 l22 -26" fill="none" stroke="#3ddc97" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="320" y="142" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="86" letter-spacing="16" fill="#f2f6f4">TASK-SPEC</text>
  <line x1="326" y1="176" x2="1052" y2="176" stroke="#ffb454" stroke-width="2" stroke-opacity="0.6"/>
  <text x="322" y="216" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="26" letter-spacing="10" fill="#8ba3b5">DEFINE DONE · PROVE THE WORK</text>
</svg>
