<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">task-spec mark</title>
  <desc id="d">App-icon mark: a spec page sealed by an amber HMAC ring with a green proof check, on a near-black rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1620"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#8ba3b5" stroke-opacity="0.25" stroke-width="2"/>

  <!-- page -->
  <rect x="66" y="52" width="124" height="152" rx="12" fill="#101b26" stroke="#5cc8ff" stroke-opacity="0.7" stroke-width="3"/>
  <g stroke-linecap="round">
    <line x1="84" y1="80" x2="172" y2="80" stroke="#ffb454" stroke-width="6"/>
    <line x1="84" y1="98" x2="156" y2="98" stroke="#8ba3b5" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="84" y1="113" x2="164" y2="113" stroke="#8ba3b5" stroke-width="5" stroke-opacity="0.5"/>
  </g>
  <rect x="82" y="128" width="92" height="44" rx="7" fill="#05080c" stroke="#3ddc97" stroke-opacity="0.5" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="92" y1="143" x2="134" y2="143" stroke="#3ddc97" stroke-width="4"/>
    <line x1="92" y1="158" x2="150" y2="158" stroke="#5cc8ff" stroke-width="4" stroke-opacity="0.85"/>
  </g>

  <!-- seal ring + check -->
  <g filter="url(#glow)">
    <circle cx="168" cy="176" r="46" fill="#0c141d" stroke="#ffb454" stroke-width="4"/>
    <circle cx="168" cy="176" r="35" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 6" stroke-opacity="0.8"/>
    <path d="M152 177 l12 12 l22 -26" fill="none" stroke="#3ddc97" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
