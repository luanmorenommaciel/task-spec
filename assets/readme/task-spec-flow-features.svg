<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Task-Spec atomic contract flow and feature envelope</title>
  <desc id="desc">Intent, repository evidence, and optional research become a deterministic plan, an atomic Task-Spec, an HMAC-authorized handoff, execution by any harness, and independent acceptance. The contract carries bounded scope, dependency edges, budgets, runnable evals, portable handoff fields, and fail-closed acceptance.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ba3b5" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68c7ff" stop-opacity="0.35"/>
      <stop offset="0.58" stop-color="#ffb454" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14202b"/>
      <stop offset="1" stop-color="#0d151d"/>
    </linearGradient>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#68c7ff"/>
    </marker>
    <style>
      .sans { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Menlo, "SFMono-Regular", Consolas, monospace; }
      .stage { fill: url(#panel); stroke: #365166; stroke-width: 2; }
      .stage-name { font: 700 22px "Avenir Next", "Helvetica Neue", Arial, sans-serif; letter-spacing: 2.4px; fill: #f2f6f4; }
      .stage-sub { font: 15px Menlo, "SFMono-Regular", Consolas, monospace; fill: #9bb0bf; }
      .index { font: 700 13px Menlo, "SFMono-Regular", Consolas, monospace; letter-spacing: 2px; fill: #68c7ff; }
      .feature { fill: #0d151d; stroke: #2b4050; stroke-width: 1.5; }
      .feature-name { font: 700 17px "Avenir Next", "Helvetica Neue", Arial, sans-serif; letter-spacing: 1.7px; fill: #f2f6f4; }
      .feature-sub { font: 14px Menlo, "SFMono-Regular", Consolas, monospace; fill: #8ba3b5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#080d12"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="24" y="24" width="1552" height="852" rx="8" fill="none" stroke="#263844" stroke-width="1.5"/>

  <text x="800" y="82" text-anchor="middle" class="sans" font-size="34" font-weight="700" letter-spacing="8" fill="#f2f6f4">THE ATOMIC CONTRACT FLOW</text>
  <text x="800" y="118" text-anchor="middle" class="mono" font-size="15" letter-spacing="2.1" fill="#8ba3b5">one declared unit · one authorization envelope · one independent acceptance rule</text>

  <path d="M105 330H1495" stroke="url(#rail)" stroke-width="4" fill="none"/>

  <!-- stage 01 -->
  <g transform="translate(65 212)">
    <rect class="stage" width="215" height="236" rx="16"/>
    <text class="index" x="22" y="32">01 · COMPOSE</text>
    <path d="M40 86C74 62 92 110 126 86S178 62 190 86" fill="none" stroke="#68c7ff" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M40 105C74 81 92 129 126 105S178 81 190 105" fill="none" stroke="#ffb454" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="108" cy="123" r="5" fill="#f2f6f4" filter="url(#blueGlow)"/>
    <text class="stage-name" x="108" y="168" text-anchor="middle">EVIDENCE</text>
    <text class="stage-sub" x="108" y="195" text-anchor="middle">intent · repo · research</text>
  </g>

  <!-- stage 02 -->
  <g transform="translate(315 212)">
    <rect class="stage" width="215" height="236" rx="16"/>
    <text class="index" x="22" y="32">02 · PLAN</text>
    <g fill="none" stroke="#68c7ff" stroke-width="2">
      <circle cx="108" cy="76" r="12"/>
      <circle cx="69" cy="124" r="10"/>
      <circle cx="108" cy="124" r="10"/>
      <circle cx="147" cy="124" r="10"/>
      <path d="M102 87L75 115M108 88V114M114 87L141 115"/>
    </g>
    <text class="stage-name" x="108" y="168" text-anchor="middle">TASKPLAN</text>
    <text class="stage-sub" x="108" y="195" text-anchor="middle">preview · DAG · collisions</text>
  </g>

  <!-- stage 03 -->
  <g transform="translate(565 192)">
    <rect width="215" height="276" rx="18" fill="#111c26" stroke="#68c7ff" stroke-width="3" filter="url(#blueGlow)"/>
    <text class="index" x="22" y="34">03 · ATOMIC SPEC</text>
    <rect x="62" y="58" width="92" height="94" rx="9" fill="#0a1118" stroke="#68c7ff" stroke-width="2"/>
    <path d="M78 80H137M78 98H126M78 116H142" stroke="#8ba3b5" stroke-width="5" stroke-linecap="round"/>
    <rect x="77" y="127" width="63" height="12" rx="4" fill="#3ddc97" fill-opacity="0.75"/>
    <path d="M52 47H165V164H52z" fill="none" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="6 7"/>
    <text class="stage-name" x="108" y="201" text-anchor="middle" fill="#68c7ff">XS · S · M · L</text>
    <text class="stage-sub" x="108" y="228" text-anchor="middle">one bounded done-condition</text>
    <text class="stage-sub" x="108" y="251" text-anchor="middle">XL / XXL decompose only</text>
  </g>

  <!-- stage 04 -->
  <g transform="translate(815 212)">
    <rect class="stage" width="215" height="236" rx="16" stroke="#7b5a2b"/>
    <text class="index" x="22" y="32" fill="#ffb454">04 · AUTHORIZE</text>
    <g transform="translate(108 105)" filter="url(#amberGlow)">
      <circle r="48" fill="#111820" stroke="#ffb454" stroke-width="3"/>
      <circle r="35" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M-11 2L-2 11L16 -12" fill="none" stroke="#ffb454" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="stage-name" x="108" y="181" text-anchor="middle" fill="#ffb454">PRE-GATE</text>
    <text class="stage-sub" x="108" y="207" text-anchor="middle">validate · HMAC v2 · tier</text>
  </g>

  <!-- stage 05 -->
  <g transform="translate(1065 212)">
    <rect class="stage" width="215" height="236" rx="16"/>
    <text class="index" x="22" y="32">05 · EXECUTE</text>
    <path d="M46 88H82M82 88L109 64M82 88L109 88M82 88L109 112M109 64H169M109 88H169M109 112H169" fill="none" stroke="#68c7ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="46" cy="88" r="7" fill="#ffb454"/>
    <circle cx="169" cy="64" r="6" fill="#68c7ff"/>
    <circle cx="169" cy="88" r="6" fill="#68c7ff"/>
    <circle cx="169" cy="112" r="6" fill="#68c7ff"/>
    <text class="stage-name" x="108" y="168" text-anchor="middle">HANDOFF</text>
    <text class="stage-sub" x="108" y="195" text-anchor="middle">any harness · same digest</text>
  </g>

  <!-- stage 06 -->
  <g transform="translate(1315 212)">
    <rect class="stage" width="215" height="236" rx="16" stroke="#28684f"/>
    <text class="index" x="22" y="32" fill="#3ddc97">06 · ACCEPT</text>
    <g transform="translate(108 104)" filter="url(#greenGlow)">
      <circle r="48" fill="#101a1a" stroke="#3ddc97" stroke-width="3"/>
      <path d="M-20 1L-6 16L24 -20" fill="none" stroke="#3ddc97" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="stage-name" x="108" y="181" text-anchor="middle" fill="#3ddc97">POST-GATE</text>
    <text class="stage-sub" x="108" y="207" text-anchor="middle">evals · scope · seal</text>
  </g>

  <!-- feature envelope -->
  <rect x="65" y="518" width="1465" height="277" rx="18" fill="#0a1118" stroke="#2d4352" stroke-width="2"/>
  <text x="98" y="558" class="mono" font-size="14" letter-spacing="2.4" fill="#ffb454">FEATURE ENVELOPE · WHAT TRAVELS WITH THE UNIT</text>

  <g transform="translate(95 588)">
    <rect class="feature" width="440" height="78" rx="12"/>
    <circle cx="32" cy="39" r="11" fill="none" stroke="#68c7ff" stroke-width="3"/>
    <path d="M26 39H38M32 33V45" stroke="#68c7ff" stroke-width="2"/>
    <text class="feature-name" x="58" y="32">BOUNDED WRITE SCOPE</text>
    <text class="feature-sub" x="58" y="56">touches + creates + do-not-touch</text>
  </g>
  <g transform="translate(580 588)">
    <rect class="feature" width="440" height="78" rx="12"/>
    <path d="M23 27H41M23 39H41M23 51H41" stroke="#68c7ff" stroke-width="3" stroke-linecap="round"/>
    <text class="feature-name" x="58" y="32">DEPENDENCIES + BUDGETS</text>
    <text class="feature-sub" x="58" y="56">frontier · effort · time · tokens</text>
  </g>
  <g transform="translate(1065 588)">
    <rect class="feature" width="440" height="78" rx="12"/>
    <path d="M22 42L30 34L38 46L46 26" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="feature-name" x="58" y="32">RUNNABLE PROOF</text>
    <text class="feature-sub" x="58" y="56">behavior → eval → Exit Check</text>
  </g>

  <g transform="translate(95 688)">
    <rect class="feature" width="440" height="78" rx="12"/>
    <circle cx="32" cy="39" r="14" fill="none" stroke="#ffb454" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text class="feature-name" x="58" y="32">TAMPER-EVIDENT AUTHORITY</text>
    <text class="feature-sub" x="58" y="56">body + paths + agent + backend sealed</text>
  </g>
  <g transform="translate(580 688)">
    <rect class="feature" width="440" height="78" rx="12"/>
    <path d="M21 39H45M39 31L47 39L39 47" fill="none" stroke="#68c7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="feature-name" x="58" y="32">PORTABLE HANDOFF</text>
    <text class="feature-sub" x="58" y="56">workspace · digest · commands · no secrets</text>
  </g>
  <g transform="translate(1065 688)">
    <rect class="feature" width="440" height="78" rx="12"/>
    <path d="M22 27H44V51H22zM27 39L31 43L39 34" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="feature-name" x="58" y="32">FAIL-CLOSED ACCEPTANCE</text>
    <text class="feature-sub" x="58" y="56">done requires accepted: true</text>
  </g>

  <text x="800" y="842" text-anchor="middle" class="mono" font-size="14" letter-spacing="2" fill="#8ba3b5">AUTHORING MAY BE ASSISTED · AUTHORIZATION IS EXPLICIT · ACCEPTANCE IS INDEPENDENT</text>
</svg>
