<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">The Task-Spec atomic contract flow and feature envelope</title>
  <desc id="desc">Six spacious stages show evidence composition, deterministic planning, atomic specification, explicit authorization, portable handoff, and independent acceptance. A separate feature envelope lists the contract properties that travel with every task.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ba3b5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14212c"/>
      <stop offset="1" stop-color="#0d151d"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68c7ff"/>
      <stop offset="0.66" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#68c7ff"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; }
      .stage-card { fill: url(#card); stroke: #365166; stroke-width: 2; }
      .stage-index { font: 700 17px Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.8px; fill: #68c7ff; }
      .stage-name { font: 700 22px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; fill: #f2f6f4; }
      .stage-sub { font: 14px Menlo, Consolas, "Liberation Mono", monospace; fill: #a9bac6; }
      .stage-proof { font: 700 13px Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.1px; fill: #68c7ff; }
      .feature-card { fill: #0d151d; stroke: #2f4656; stroke-width: 1.5; }
      .feature-name { font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; fill: #f2f6f4; }
      .feature-sub { font: 15px Menlo, Consolas, "Liberation Mono", monospace; fill: #9bb0bf; }
      .edge { fill: none; stroke: url(#rail); stroke-width: 3; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="#080d12"/>
  <rect width="1800" height="1220" fill="url(#grid)"/>
  <rect x="24" y="24" width="1752" height="1172" rx="10" fill="none" stroke="#263844" stroke-width="1.5"/>

  <text x="900" y="74" text-anchor="middle" class="sans" font-size="36" font-weight="700" letter-spacing="7" fill="#f2f6f4">THE ATOMIC CONTRACT FLOW</text>
  <text x="900" y="112" text-anchor="middle" class="mono" font-size="16" letter-spacing="1.8" fill="#8ba3b5">one declared unit · one authorization envelope · one independent acceptance rule</text>

  <path class="edge" d="M600 295H626"/>
  <path class="edge" d="M1160 295H1186"/>
  <path d="M1720 295H1750V462H50V625H66" fill="none" stroke="#68c7ff" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrowBlue)"/>
  <text x="900" y="456" text-anchor="middle" class="mono" font-size="13" letter-spacing="1.7" fill="#68c7ff">THE APPROVED LEAF CROSSES THE AUTHORIZATION BOUNDARY</text>
  <path class="edge" d="M600 625H626"/>
  <path class="edge" d="M1160 625H1186"/>

  <!-- 01: compose -->
  <g class="stage" data-stage="01" transform="translate(80 170)">
    <rect class="stage-card" data-card-bg="true" width="520" height="250" rx="18"/>
    <text class="stage-index" x="28" y="38">01 · COMPOSE</text>
    <g transform="translate(105 126)" fill="none" stroke-linecap="round">
      <path d="M-52 -30C-20 -54 10 -6 44 -30" stroke="#68c7ff" stroke-width="3"/>
      <path d="M-52 0C-20 -24 10 24 44 0" stroke="#ffb454" stroke-width="3"/>
      <path d="M-52 30C-20 6 10 54 44 30" stroke="#3ddc97" stroke-width="3"/>
      <circle cx="58" cy="0" r="7" fill="#f2f6f4" stroke="none"/>
    </g>
    <path d="M190 66V214" stroke="#2f4656" stroke-width="1.5"/>
    <text class="stage-name" x="218" y="104">COMPOSE EVIDENCE</text>
    <text class="stage-sub" x="218" y="145">intent · repository context</text>
    <text class="stage-sub" x="218" y="176">optional cited research</text>
    <text class="stage-proof" x="218" y="215">BOUNDED AUTHORING INPUT</text>
  </g>

  <!-- 02: plan -->
  <g class="stage" data-stage="02" transform="translate(640 170)">
    <rect class="stage-card" data-card-bg="true" width="520" height="250" rx="18"/>
    <text class="stage-index" x="28" y="38">02 · PLAN</text>
    <g transform="translate(105 126)" fill="none" stroke="#68c7ff" stroke-width="3">
      <circle cy="-42" r="14"/>
      <circle cx="-47" cy="35" r="12"/>
      <circle cy="35" r="12"/>
      <circle cx="47" cy="35" r="12"/>
      <path d="M-8 -30L-40 24M0 -28V23M8 -30L40 24"/>
    </g>
    <path d="M190 66V214" stroke="#2f4656" stroke-width="1.5"/>
    <text class="stage-name" x="218" y="104">PREVIEW TASKPLAN</text>
    <text class="stage-sub" x="218" y="145">declared units · dependency DAG</text>
    <text class="stage-sub" x="218" y="176">write-conflict analysis</text>
    <text class="stage-proof" x="218" y="215">DETERMINISTIC PREVIEW</text>
  </g>

  <!-- 03: atomic spec -->
  <g class="stage" data-stage="03" transform="translate(1200 170)">
    <rect class="stage-card" data-card-bg="true" width="520" height="250" rx="18" stroke="#68c7ff" stroke-width="3"/>
    <text class="stage-index" x="28" y="38">03 · ATOMIC SPEC</text>
    <g transform="translate(59 72)">
      <rect width="94" height="112" rx="9" fill="#0a1118" stroke="#68c7ff" stroke-width="2"/>
      <path d="M18 26H75M18 47H67M18 68H78" stroke="#8ba3b5" stroke-width="5" stroke-linecap="round"/>
      <rect x="18" y="86" width="58" height="12" rx="4" fill="#3ddc97"/>
      <rect x="-13" y="-13" width="120" height="138" fill="none" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="6 7"/>
    </g>
    <path d="M190 66V214" stroke="#2f4656" stroke-width="1.5"/>
    <text class="stage-name" x="218" y="104">FORM ATOMIC SPEC</text>
    <text class="stage-sub" x="218" y="145">runnable leaf · XS / S / M / L</text>
    <text class="stage-sub" x="218" y="176">XL / XXL decompose only</text>
    <text class="stage-proof" x="218" y="215">ONE BOUNDED DONE-CONDITION</text>
  </g>

  <!-- 04: authorize -->
  <g class="stage" data-stage="04" transform="translate(80 500)">
    <rect class="stage-card" data-card-bg="true" width="520" height="250" rx="18" stroke="#8c672f"/>
    <text class="stage-index" x="28" y="38" fill="#ffb454">04 · AUTHORIZE</text>
    <g transform="translate(105 128)">
      <circle r="58" fill="#111820" stroke="#ffb454" stroke-width="3"/>
      <circle r="43" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 7"/>
      <path d="M-17 1L-5 14L22 -19" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M190 66V214" stroke="#2f4656" stroke-width="1.5"/>
    <text class="stage-name" x="218" y="104">AUTHORIZE LEAF</text>
    <text class="stage-sub" x="218" y="145">validate · DoD · HMAC v3</text>
    <text class="stage-sub" x="218" y="176">explicit delegation tier</text>
    <text class="stage-proof" x="218" y="215" fill="#ffb454">PRE-GATE · HUMAN DECISION</text>
  </g>

  <!-- 05: handoff -->
  <g class="stage" data-stage="05" transform="translate(640 500)">
    <rect class="stage-card" data-card-bg="true" width="520" height="250" rx="18"/>
    <text class="stage-index" x="28" y="38">05 · EXECUTE</text>
    <g transform="translate(48 82)" fill="none" stroke="#68c7ff" stroke-width="3" stroke-linecap="round">
      <path d="M0 46H42M42 46L79 10M42 46H79M42 46L79 82M79 10H127M79 46H127M79 82H127"/>
      <circle cy="46" r="8" fill="#ffb454" stroke="none"/>
      <circle cx="127" cy="10" r="6" fill="#68c7ff" stroke="none"/>
      <circle cx="127" cy="46" r="6" fill="#68c7ff" stroke="none"/>
      <circle cx="127" cy="82" r="6" fill="#68c7ff" stroke="none"/>
    </g>
    <path d="M190 66V214" stroke="#2f4656" stroke-width="1.5"/>
    <text class="stage-name" x="218" y="104">PORTABLE HANDOFF</text>
    <text class="stage-sub" x="218" y="145">same digest · bounded scope</text>
    <text class="stage-sub" x="218" y="176">Codex · Claude · Kimi · custom</text>
    <text class="stage-proof" x="218" y="215">CREDENTIAL-FREE CONTRACT</text>
  </g>

  <!-- 06: accept -->
  <g class="stage" data-stage="06" transform="translate(1200 500)">
    <rect class="stage-card" data-card-bg="true" width="520" height="250" rx="18" stroke="#28775a"/>
    <text class="stage-index" x="28" y="38" fill="#3ddc97">06 · ACCEPT</text>
    <g transform="translate(105 128)">
      <circle r="58" fill="#101a1a" stroke="#3ddc97" stroke-width="3"/>
      <path d="M-24 0L-8 18L29 -26" fill="none" stroke="#3ddc97" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M190 66V214" stroke="#2f4656" stroke-width="1.5"/>
    <text class="stage-name" x="218" y="104" fill="#3ddc97">INDEPENDENT ACCEPT</text>
    <text class="stage-sub" x="218" y="145">evals · blast radius · seal</text>
    <text class="stage-sub" x="218" y="176">accepted: true or fail closed</text>
    <text class="stage-proof" x="218" y="215" fill="#3ddc97">POST-GATE · FINAL VERDICT</text>
  </g>

  <!-- feature envelope -->
  <rect x="55" y="810" width="1690" height="300" rx="20" fill="#0a1118" stroke="#2d4352" stroke-width="2"/>
  <text x="86" y="852" class="mono" font-size="15" letter-spacing="2.2" fill="#ffb454">FEATURE ENVELOPE · WHAT TRAVELS WITH EVERY TASK</text>

  <g class="feature" transform="translate(80 880)">
    <rect class="feature-card" width="510" height="82" rx="12"/>
    <circle cx="34" cy="41" r="12" fill="none" stroke="#68c7ff" stroke-width="3"/>
    <path d="M28 41H40M34 35V47" stroke="#68c7ff" stroke-width="2"/>
    <text class="feature-name" x="62" y="34">BOUNDED WRITE SCOPE</text>
    <text class="feature-sub" x="62" y="60">touches · creates · do-not-touch</text>
  </g>
  <g class="feature" transform="translate(645 880)">
    <rect class="feature-card" width="510" height="82" rx="12"/>
    <path d="M25 29H45M25 41H45M25 53H45" stroke="#68c7ff" stroke-width="3" stroke-linecap="round"/>
    <text class="feature-name" x="62" y="34">DEPENDENCIES + BUDGETS</text>
    <text class="feature-sub" x="62" y="60">frontier · effort · time · tokens</text>
  </g>
  <g class="feature" transform="translate(1210 880)">
    <rect class="feature-card" width="510" height="82" rx="12"/>
    <path d="M24 44L31 36L39 48L48 27" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="feature-name" x="62" y="34">RUNNABLE PROOF</text>
    <text class="feature-sub" x="62" y="60">behavior → eval → exit check</text>
  </g>
  <g class="feature" transform="translate(80 985)">
    <rect class="feature-card" width="510" height="82" rx="12"/>
    <circle cx="34" cy="41" r="15" fill="none" stroke="#ffb454" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text class="feature-name" x="62" y="34">TAMPER-EVIDENT AUTHORITY</text>
    <text class="feature-sub" x="62" y="60">body · paths · agent · backend sealed</text>
  </g>
  <g class="feature" transform="translate(645 985)">
    <rect class="feature-card" width="510" height="82" rx="12"/>
    <path d="M23 41H48M41 33L50 41L41 49" fill="none" stroke="#68c7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="feature-name" x="62" y="34">PORTABLE HANDOFF</text>
    <text class="feature-sub" x="62" y="60">workspace · digest · commands · no secrets</text>
  </g>
  <g class="feature" transform="translate(1210 985)">
    <rect class="feature-card" width="510" height="82" rx="12"/>
    <path d="M24 28H47V54H24zM29 41L34 46L42 36" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="feature-name" x="62" y="34">FAIL-CLOSED ACCEPTANCE</text>
    <text class="feature-sub" x="62" y="60">done requires accepted: true</text>
  </g>

  <text x="900" y="1162" text-anchor="middle" class="mono" font-size="14" letter-spacing="1.8" fill="#8ba3b5">AUTHORING MAY BE ASSISTED · AUTHORIZATION IS EXPLICIT · ACCEPTANCE IS INDEPENDENT</text>
</svg>
