<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="icon-dark-title icon-dark-desc">
  <title id="icon-dark-title">TASK-SPEC Receipt Gate Icon (Dark/Black)</title>
  <desc id="icon-dark-desc">Receipt Gate mark for light backgrounds: Factory Black gate posts and lines with Proof Gold verdict.</desc>
  
  <!-- Transparent background -->
  <rect width="256" height="256" fill="none"/>
  
  <!-- Receipt Gate Mark - centered -->
  <g transform="translate(48, 48)">
    <!-- Left gate post -->
    <rect fill="#070A0F" x="0" y="0" width="20" height="160" rx="3"/>
    
    <!-- Receipt lines (3 lines) -->
    <rect fill="#070A0F" x="40" y="32" width="80" height="16" rx="2"/>
    <rect fill="#070A0F" x="40" y="72" width="64" height="16" rx="2"/>
    <rect fill="#E4A51A" x="40" y="112" width="48" height="16" rx="2"/>
    
    <!-- Right gate post -->
    <rect fill="#070A0F" x="140" y="0" width="20" height="160" rx="3"/>
  </g>
</svg>
