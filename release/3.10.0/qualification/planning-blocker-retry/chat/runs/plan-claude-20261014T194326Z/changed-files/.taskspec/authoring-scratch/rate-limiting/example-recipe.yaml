{
  "contract": "TaskExecutionRecipe/v1",
  "strategy": "diagnose-repair-verify",
  "strategy_version": "1.0.0",
  "steps": [
    "Reproduce the failure and gather evidence before choosing a cause.",
    "Repair the evidenced cause within scope.",
    "Verify the reproduction and affected regression checks."
  ],
  "context": [
    "TaskHandoff",
    "authorized Task-Spec",
    "declared source evidence"
  ],
  "artifacts": [
    "scoped changes",
    "evaluation evidence",
    "concise result"
  ],
  "eval_ids": [
    "eval_1"
  ],
  "max_rounds": 3,
  "no_progress_rounds": 2,
  "stop_on": [
    "scope_violation",
    "authority_changed",
    "environment_unverified",
    "budget_exhausted",
    "cancelled"
  ],
  "on_failure": "park_with_context",
  "runner": "taskmesh",
  "required_capabilities": [
    "managed_recipe_v1",
    "persistent_round_budget",
    "signed_timeout"
  ]
}
