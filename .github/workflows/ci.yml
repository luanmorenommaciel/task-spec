# CI runs the same boundary a contributor runs locally: `make check`.
# Credential-free by design — no secrets or real-engine executors. The
# separately dispatched engine-evidence workflow owns retained provider runs.
#
# Lean default: pull_request and push to main run `make check` on ubuntu only.
# The macOS leg (bash 3.2 / BSD portability) runs on workflow_dispatch and the
# weekly schedule, so release qualification still gets both
# `make check (ubuntu-latest)` and `make check (macos-latest)` from a dispatch.
name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  schedule:
    - cron: '0 6 * * 1' # weekly ubuntu + macOS portability run

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # macOS only on dispatch/schedule; PRs and pushes stay ubuntu-only.
        exclude:
          - os: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'macos-latest' || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go toolchain for optional TaskMesh
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: go.sum

      - name: Install macOS gate dependency
        if: runner.os == 'macOS'
        run: brew list shellcheck >/dev/null 2>&1 || brew install shellcheck

      - name: Provision private locked decomposition runtime
        run: bash bin/taskspec setup decompose

      - name: Install schema-fidelity consumer dependencies
        # tests/test-portability-e2e.sh Step 6 runs docs/examples/consume-task-spec.py,
        # which requires PyYAML and validates with jsonschema when present.
        # Install both explicitly so hosted proof never depends on runner-image
        # package drift. Pinned for determinism.
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          --break-system-packages pyyaml==6.0.2 jsonschema==4.26.0

      - name: make check (includes isolated install-to-accept demo)
        run: make check

  mesh-isolation:
    if: github.event_name == 'workflow_dispatch'
    name: TaskMesh autonomous isolation (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: go.sum
      - name: Require live Docker isolation proof
        env:
          TASKSPEC_REQUIRE_MESH_ISOLATION: '1'
        run: |
          bash tests/test-mesh-isolation.sh
          bash tests/test-toolkit-attested.sh
