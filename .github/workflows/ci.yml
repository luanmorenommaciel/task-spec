# CI runs the same boundary a contributor runs locally: `make check`.
# Credential-free by design — no secrets or real-engine executors. The
# separately dispatched engine-evidence workflow owns retained provider runs.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go toolchain for optional TaskMesh
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: go.sum

      - name: Install shellcheck (macOS)
        # ubuntu-latest ships shellcheck; macOS runners do not, and the gate's
        # --shellcheck-evals lint hard-requires it. Pinned by SHA-256.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver="v0.10.0"
          arch="$(uname -m)"
          case "$arch" in
            arm64)  asset="darwin.aarch64"; sha="bbd2f14826328eee7679da7221f2bc3afb011f6a928b848c80c321f6046ddf81" ;;
            x86_64) asset="darwin.x86_64";  sha="ef27684f23279d112d8ad84e0823642e43f838993bbb8c0963db9b58a90464c2" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.${asset}.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install schema-fidelity consumer dependencies
        # tests/test-portability-e2e.sh Step 6 runs docs/examples/consume-task-spec.py,
        # which requires PyYAML and validates with jsonschema when present.
        # Install both explicitly so hosted proof never depends on runner-image
        # package drift. Pinned for determinism.
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          --break-system-packages pyyaml==6.0.2 jsonschema==4.26.0

      - name: make check (includes isolated install-to-accept demo)
        run: make check

  mesh-isolation:
    name: TaskMesh autonomous isolation (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: go.sum
      - name: Require live Docker isolation proof
        env:
          TASKSPEC_REQUIRE_MESH_ISOLATION: '1'
        run: bash tests/test-mesh-isolation.sh
