# CI runs the same boundary a contributor runs locally: `make check`.
# Credential-free by design — no secrets, no real-engine executors (that matrix
# is TODO P0-1 and builds on this foundation).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install shellcheck (macOS)
        # ubuntu-latest ships shellcheck; macOS runners do not, and the gate's
        # --shellcheck-evals lint hard-requires it. Pinned by SHA-256.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver="v0.10.0"
          arch="$(uname -m)"
          case "$arch" in
            arm64)  asset="darwin.aarch64"; sha="bbd2f14826328eee7679da7221f2bc3afb011f6a928b848c80c321f6046ddf81" ;;
            x86_64) asset="darwin.x86_64";  sha="ef27684f23279d112d8ad84e0823642e43f838993bbb8c0963db9b58a90464c2" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.${asset}.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install pyyaml (schema-fidelity consumer test)
        # tests/test-portability-e2e.sh Step 6 runs docs/examples/consume-task-spec.py,
        # which requires PyYAML. Pinned for determinism.
        run: python3 -m pip install --disable-pip-version-check --quiet --break-system-packages pyyaml==6.0.2

      - name: make check
        run: make check
