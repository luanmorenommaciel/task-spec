# Real distribution-door proof. This runs only for a published release or an
# explicitly selected tag, so it never turns an unpublished ref into evidence.
name: release-install-smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to verify (for example v3.8.0)
        required: true

permissions:
  contents: write

jobs:
  release-assets:
    name: checksum-backed release archive
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_ref }}
    steps:
      - name: Checkout the exact release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Build deterministic archive and checksum
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "v$(tr -d '[:space:]' < VERSION)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python3 tools/build-release-archive.py --out-dir dist
      - name: Attach immutable assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_REF" dist/task-spec-*.tar.gz dist/task-spec-*.sha256 --clobber

  install:
    name: remote install (${{ matrix.os }})
    needs: release-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_ref }}
    steps:
      - name: Checkout the exact release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver="v0.10.0"
          arch="$(uname -m)"
          case "$arch" in
            arm64)  asset="darwin.aarch64"; sha="bbd2f14826328eee7679da7221f2bc3afb011f6a928b848c80c321f6046ddf81" ;;
            x86_64) asset="darwin.x86_64";  sha="ef27684f23279d112d8ad84e0823642e43f838993bbb8c0963db9b58a90464c2" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.${asset}.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck

      - name: Verify release identity
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "v$(tr -d '[:space:]' < VERSION)"

      - name: Prove authenticated release installer and isolated lifecycle
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/home" "$work/project" "$work/bin" "$work/install-root" "$work/assets" release-install-logs
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/contents/install.sh?ref=${RELEASE_REF}" \
            > "$work/install.sh"
          gh release download "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" \
            --pattern "task-spec-${RELEASE_REF#v}.tar.gz" \
            --pattern "task-spec-${RELEASE_REF#v}.tar.gz.sha256" \
            --dir "$work/assets"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$work/assets" \
            > release-install-logs/asset-server.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS "http://127.0.0.1:8765/task-spec-${RELEASE_REF#v}.tar.gz.sha256" >/dev/null && break
            [[ "$attempt" -lt 5 ]] || exit 1
            sleep 1
          done
          HOME="$work/home" TASKSPEC_INSTALL_ROOT="$work/install-root" \
            TASKSPEC_RELEASE_BASE_URL="http://127.0.0.1:8765" \
            bash "$work/install.sh" --target "$work/project" --bin-dir "$work/bin" \
            | tee release-install-logs/authenticated-release-install.log
          test "$("$work/bin/taskspec" version)" = "${RELEASE_REF#v}"
          "$work/bin/taskspec" demo | tee release-install-logs/authenticated-release-demo.log
          grep -q '^INSTALL=OK$' release-install-logs/authenticated-release-install.log
          grep -q '^DEMO=READY$' release-install-logs/authenticated-release-demo.log

      - name: Prove npm GitHub installer and isolated lifecycle
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/home" "$work/project" "$work/install-root" release-install-logs
          HOME="$work/home" gh auth setup-git
          HOME="$work/home" npm install --global --prefix "$work/npm" \
            "git+https://github.com/${GITHUB_REPOSITORY}.git#${RELEASE_REF}" \
            | tee release-install-logs/npm-install.log
          test "$("$work/npm/bin/taskspec" version)" = "${RELEASE_REF#v}"
          TASKSPEC_INSTALL_ROOT="$work/install-root" \
            "$work/npm/bin/taskspec-install" --target "$work/project" --no-bin \
            | tee release-install-logs/npm-harness-install.log
          "$work/npm/bin/taskspec" demo | tee release-install-logs/npm-demo.log
          grep -q '^INSTALL=OK$' release-install-logs/npm-harness-install.log
          grep -q '^DEMO=READY$' release-install-logs/npm-demo.log

      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-install-${{ env.RELEASE_REF }}-${{ matrix.os }}
          path: release-install-logs/
          if-no-files-found: error
          retention-days: 90
