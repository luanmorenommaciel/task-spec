# Real distribution-door proof. This runs only for a published release or an
# explicitly selected tag, so it never turns an unpublished ref into evidence.
name: release-install-smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to verify (for example v3.8.0)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    name: checksum-backed release archive
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_ref }}
    steps:
      - name: Checkout the exact release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Build deterministic archives, checksum, and SPDX SBOM
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          case "$RELEASE_REF" in
            "v$version"|"v$version-rc."*) ;;
            *) echo "release ref $RELEASE_REF does not carry Task-Spec $version" >&2; exit 1 ;;
          esac
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          epoch="$(git show -s --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$epoch" python3 tools/build-release-archive.py --out-dir dist
          python3 tools/build-sbom.py \
            --archive "dist/task-spec-$(cat VERSION).tar.gz" \
            --epoch "$epoch" \
            --out "dist/task-spec-$(cat VERSION).spdx.json"
          SOURCE_DATE_EPOCH="$epoch" python3 tools/build-release-evidence-archive.py --out-dir dist
          cp release/evidence.json "dist/task-spec-$(cat VERSION)-release-evidence.json"
          cp "release/$(cat VERSION)/scorecard.json" "dist/task-spec-$(cat VERSION)-scorecard.json"
          cp "release/$(cat VERSION)/reviewer-report.json" "dist/task-spec-$(cat VERSION)-reviewer-report.json"
          (cd dist && shasum -a 256 task-spec-* > "task-spec-$(cat ../VERSION)-checksums.txt")

      - name: Attach immutable assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_REF" dist/task-spec-* --clobber

  provenance:
    name: GitHub artifact and SBOM attestations
    needs: release-assets
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_ref }}
    steps:
      - name: Checkout the exact release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Download the immutable subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          gh release download "$RELEASE_REF" --dir dist \
            --pattern "task-spec-${version}.tar.gz" \
            --pattern "task-spec-${version}.spdx.json"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/task-spec-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Attest SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: dist/task-spec-${{ env.RELEASE_VERSION }}.tar.gz
          sbom-path: dist/task-spec-${{ env.RELEASE_VERSION }}.spdx.json

  install:
    name: remote install (${{ matrix.os }})
    needs: release-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_ref }}
    steps:
      - name: Checkout the exact release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver="v0.10.0"
          arch="$(uname -m)"
          case "$arch" in
            arm64)  asset="darwin.aarch64"; sha="bbd2f14826328eee7679da7221f2bc3afb011f6a928b848c80c321f6046ddf81" ;;
            x86_64) asset="darwin.x86_64";  sha="ef27684f23279d112d8ad84e0823642e43f838993bbb8c0963db9b58a90464c2" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.${asset}.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck

      - name: Verify release identity
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          case "$RELEASE_REF" in
            "v$version"|"v$version-rc."*) ;;
            *) echo "release ref $RELEASE_REF does not carry Task-Spec $version" >&2; exit 1 ;;
          esac
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Prove curl installer and isolated lifecycle
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/home" "$work/project" "$work/bin" "$work/install-root" "$work/logs"
          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_REF}/install.sh" \
            -o "$work/install.sh"
          HOME="$work/home" TASKSPEC_INSTALL_ROOT="$work/install-root" \
            TASKSPEC_RELEASE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_REF}" \
            bash "$work/install.sh" --target "$work/project" --bin-dir "$work/bin" \
            | tee "$work/logs/curl-install.log"
          test "$("$work/bin/taskspec" version)" = "$RELEASE_VERSION"
          "$work/bin/taskspec" demo | tee "$work/logs/curl-demo.log"
          grep -q '^INSTALL=OK$' "$work/logs/curl-install.log"
          grep -q '^DEMO=READY$' "$work/logs/curl-demo.log"
          cp -R "$work/logs" release-install-logs

      - name: Prove npm GitHub installer and isolated lifecycle
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/project" "$work/install-root" "$work/logs"
          npm install --global --prefix "$work/npm" \
            "github:${GITHUB_REPOSITORY}#${RELEASE_REF}" \
            | tee "$work/logs/npm-install.log"
          test "$("$work/npm/bin/taskspec" version)" = "$RELEASE_VERSION"
          TASKSPEC_INSTALL_ROOT="$work/install-root" \
            "$work/npm/bin/taskspec-install" --target "$work/project" --no-bin \
            | tee "$work/logs/npm-harness-install.log"
          "$work/npm/bin/taskspec" demo | tee "$work/logs/npm-demo.log"
          grep -q '^INSTALL=OK$' "$work/logs/npm-harness-install.log"
          grep -q '^DEMO=READY$' "$work/logs/npm-demo.log"
          cp -R "$work/logs/." release-install-logs/

      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-install-${{ env.RELEASE_REF }}-${{ matrix.os }}
          path: release-install-logs/
          if-no-files-found: error
          retention-days: 90
