# Manual release experiment. The repository's normal CI remains credential-free.
# A release operator enables only adapters whose credentials/runners are present,
# commits or supplies the exact matrix + handoff, and retains every raw result.
name: engine-evidence

on:
  workflow_dispatch:
    inputs:
      handoff_path:
        description: Checked-in credential-free TaskHandoff v1/v2 JSON
        required: true
        default: release/3.7/task-handoff.json
      matrix_path:
        description: Checked-in EngineMatrix v1 with exact enabled model ids and argv
        required: true
        default: release/3.7/engine-matrix.json

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate declared experiment
        run: |
          bin/taskspec evidence validate "${{ inputs.matrix_path }}"
          test -f "${{ inputs.handoff_path }}"

      - name: Run enabled adapters
        # This reference workflow is deliberately credential-free. A release
        # environment overlays provider-specific, least-privilege jobs; never
        # expose every provider secret to every matrix command.
        run: |
          bin/taskspec evidence run "${{ inputs.matrix_path }}" \
            --handoff "${{ inputs.handoff_path }}" \
            --out-dir engine-evidence

      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-evidence-${{ github.sha }}
          path: engine-evidence/
          if-no-files-found: error
          retention-days: 90
